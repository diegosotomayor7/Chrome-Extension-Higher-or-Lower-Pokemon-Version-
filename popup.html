<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="main-menu" class="screen">
    <div class="menu-pokemon" aria-hidden="true">
      <img class="face-right" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" alt="" title="Bulbasaur" style="left: -6px; top: -8px; width: 97px;">
      <img class="face-right" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/39.png" alt="" title="Jigglypuff" style="left: 90px; top: 8px; width: 76px;">
      <img class="face-right" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/151.png" alt="" title="Mew" style="left: 176px; top: -14px; width: 81px;">
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/175.png" alt="" title="Togepi" style="left: 253px; top: 7px; width: 70px;">
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/133.png" alt="" title="Eevee" style="left: 319px; top: -9px; width: 89px;">
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/7.png" alt="" title="Squirtle" style="left: 408px; top: -6px; width: 94px;">
      <img class="face-right" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="" title="Pikachu" style="left: 0px; top: 110px; width: 124px;">
      <img class="face-right" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/94.png" alt="" title="Gengar" style="left: -20px; top: 198px; width: 113px;">
      <img class="face-right" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/255.png" alt="" title="Torchic" style="left: 62px; top: 242px; width: 81px;">
      <img class="face-right" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4.png" alt="" title="Charmander" style="left: 4px; top: 290px; width: 108px;">
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/143.png" alt="" title="Snorlax" style="left: 376px; top: 108px; width: 124px;">
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/448.png" alt="" title="Lucario" style="left: 354px; top: 200px; width: 108px;">
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/778.png" alt="" title="Mimikyu" style="left: 425px; top: 225px; width: 84px;">
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/658.png" alt="" title="Greninja" style="left: 389px; top: 285px; width: 119px;">
      <img class="face-right" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/722.png" alt="" title="Rowlet" style="left: 107px; top: 319px; width: 84px;">
      <img class="face-right" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/906.png" alt="" title="Sprigatito" style="left: 180px; top: 322px; width: 78px;">
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/816.png" alt="" title="Sobble" style="left: 248px; top: 322px; width: 78px;">
      <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/54.png" alt="" title="Psyduck" style="left: 315px; top: 313px; width: 86px;">
    </div>
    <h2 id="title">Pokemon: Higher or Lower</h2>
    <div class="main-buttons">
      <button id="daily-btn" class="main-btn">Daily Challenge!</button>
      <button id="play-btn" class="main-btn">Simple Play</button>
      <button id="stats-btn" class="main-btn">Stats</button>
    </div>
  </div>

  <div id="menu-container" class="screen" style="display: none;">
    <button id="play-back-btn" class="back-btn">&larr; Back</button>
    <h4 id="subtitle">Select the generations you want to include</h4>

    <div class="gen-buttons">  

      <div class= "gen-item">
        <img id="charmander" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4.png" alt="Charmander">
        <button id="gen1-btn" class="deselected">1 Kanto</button>
      </div>

      <div class= "gen-item">
        <img id="chikorita" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/152.png" alt="Chikorita">
        <button id="gen2-btn" class="deselected">2 Johto</button>
      </div>

      <div class= "gen-item">
        <img id="mudkip" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/258.png" alt="Mudkip">
        <button id="gen3-btn" class="deselected">3 Hoenn</button>
      </div>

      <div class= "gen-item">
        <img id="piplup" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/393.png" alt="Piplup">
        <button id="gen4-btn" class="deselected">4 Sinnoh</button>
      </div>

      <div class= "gen-item">
        <img id="snivy" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/495.png" alt="Snivy">
        <button id="gen5-btn" class="deselected">5 Unova</button>
      </div>

      <div class= "gen-item">
        <img id="froakie" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/656.png" alt="Froakie">
        <button id="gen6-btn" class="deselected">6 Kalos</button>
      </div>

      <div class= "gen-item">
        <img id="litten" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/725.png" alt="Litten">
        <button id="gen7-btn" class="deselected">7 Alola</button>
      </div>

      <div class= "gen-item">
        <img id="grookey" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/810.png" alt="Grookey">
        <button id="gen8-btn" class="deselected">8 Galar</button>
      </div>

      <div class= "gen-item">
        <img id="fuecoco" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/909.png" alt="Fuecoco">
        <button id="gen9-btn" class="deselected">9 Paldea</button>
      </div>

      <div class="gen-item">
        <img id="pikachu" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="Pikachu">
        <button id="all-btn" class="deselected">All</button>
      </div>
    </div>

    <div class="difficulty-buttons">
      <button id="easy-btn" class="difficulty-btn deselected" data-difficulty="easy">Easy</button>
      <button id="normal-btn" class="difficulty-btn selected" data-difficulty="normal">Normal</button>
      <button id="hard-btn" class="difficulty-btn deselected" data-difficulty="hard">Hard</button>
      <button id="extreme-btn" class="difficulty-btn deselected" data-difficulty="extreme">Extreme</button>
    </div>
    <button id="start-btn">Start</button>
  </div>
  <div id="game-container" class="screen" style="display: none;">
    <button id="game-back-btn" class="back-btn">&larr; Back</button>
    <div id="round-label"></div>
    <div id="score-label">Score: 0</div>
    <div id="high-score-label">Best: 0</div>
    <div id="question-label">Loading...</div>

    <div id="vs-area">
      <div class="pkmn-side">
        <img id="left-img" src="" alt="Left Pokemon">
        <div id="left-name" class="name-label"></div>
      </div>

      <div id="vs-circle">VS</div>

      <div class="pkmn-side">
        <img id="right-img" src="" alt="Right Pokemon">
        <div id="right-name" class="name-label"></div>
      </div>
    </div>

    <div class="button-container">
      <button id="higher-btn">Higher</button>
      <button id="lower-btn">Lower</button>
    </div>
  </div>

  <div id="daily-summary" class="screen" style="display: none;">
    <button id="summary-back-btn" class="back-btn">&larr; Back</button>
    <h2>Daily Challenge</h2>
    <div id="daily-date"></div>
    <div id="daily-score"></div>
    <div id="daily-detail"></div>
    <div id="daily-tomorrow">See you tomorrow!</div>
  </div>

  <div id="stats-screen" class="screen" style="display: none;">
    <button id="stats-back-btn" class="back-btn">&larr; Back</button>
    <h2>Stats</h2>
    <h4>Best scores</h4>
    <table id="stats-table">
      <tr><th class="difficulty-easy">Easy</th><td id="best-easy">0</td></tr>
      <tr><th class="difficulty-normal">Normal</th><td id="best-normal">0</td></tr>
      <tr><th class="difficulty-hard">Hard</th><td id="best-hard">0</td></tr>
      <tr><th class="difficulty-extreme">Extreme</th><td id="best-extreme">0</td></tr>
    </table>
    <div id="daily-completed">Daily challenges completed: 0</div>
  </div>
  <script src="vendor/sql.js/sql-wasm-browser.js"></script>
  <script src="wasm/pkmn-engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
