<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="menu-container">
    <h2 id="title">Pokemon: Higher or Lower</h2>
    <h4 id="subtitle">Select the generations you want to include</h4>

    <div class="gen-buttons">  

      <div class= "gen-item">
        <img id="charmander" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4.png" alt="Charmander">
        <button id="gen1-btn" class="deselected">1 Kanto</button>
      </div>

      <div class= "gen-item">
        <img id="chikorita" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/152.png" alt="Chikorita">
        <button id="gen2-btn" class="deselected">2 Johto</button>
      </div>

      <div class= "gen-item">
        <img id="mudkip" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/258.png" alt="Mudkip">
        <button id="gen3-btn" class="deselected">3 Hoenn</button>
      </div>

      <div class= "gen-item">
        <img id="piplup" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/393.png" alt="Piplup">
        <button id="gen4-btn" class="deselected">4 Sinnoh</button>
      </div>

      <div class= "gen-item">
        <img id="snivy" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/495.png" alt="Snivy">
        <button id="gen5-btn" class="deselected">5 Unova</button>
      </div>

      <div class= "gen-item">
        <img id="froakie" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/656.png" alt="Froakie">
        <button id="gen6-btn" class="deselected">6 Kalos</button>
      </div>

      <div class= "gen-item">
        <img id="litten" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/725.png" alt="Litten">
        <button id="gen7-btn" class="deselected">7 Alola</button>
      </div>

      <div class= "gen-item">
        <img id="grookey" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/810.png" alt="Grookey">
        <button id="gen8-btn" class="deselected">8 Galar</button>
      </div>

      <div class= "gen-item">
        <img id="fuecoco" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/909.png" alt="Fuecoco">
        <button id="gen9-btn" class="deselected">9 Paldea</button>
      </div>

      <div class="gen-item">
        <img id="pikachu" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png" alt="Pikachu">
        <button id="all-btn" class="deselected">All</button>
      </div>
    </div>

    <div class="difficulty-buttons">
      <button id="easy-btn" class="difficulty-btn deselected" data-difficulty="easy">Easy</button>
      <button id="normal-btn" class="difficulty-btn selected" data-difficulty="normal">Normal</button>
      <button id="hard-btn" class="difficulty-btn deselected" data-difficulty="hard">Hard</button>
      <button id="extreme-btn" class="difficulty-btn deselected" data-difficulty="extreme">Extreme</button>
    </div>
    <button id="start-btn">Start</button>
  </div>
  <div id="game-container" style="display: none;">
    <div id="score-label">Score: 0</div>
    <div id="high-score-label">Best: 0</div>
    <div id="question-label">Loading...</div>

    <div id="vs-area">
      <div class="pkmn-side">
        <img id="left-img" src="" alt="Left Pokemon">
        <div id="left-name" class="name-label"></div>
      </div>

      <div id="vs-circle">VS</div>

      <div class="pkmn-side">
        <img id="right-img" src="" alt="Right Pokemon">
        <div id="right-name" class="name-label"></div>
      </div>
    </div>

    <div class="button-container">
      <button id="higher-btn">Higher</button>
      <button id="lower-btn">Lower</button>
    </div>
  </div>
  <script src="vendor/sql.js/sql-wasm-browser.js"></script>
  <script src="wasm/pkmn-engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
